# Cuando existe este archivo, Vercel instala las dependencias desde la tabla
# [project] e ignora requirements.txt. Por eso se repiten acá.
# requirements.txt queda para la instalación local con pip
# (`pip install -r requirements-dev.txt`). Si agregás o cambiás una
# dependencia, actualizala en los dos archivos.
# La versión de Python se fija en .python-version.

[project]
name = "appminds-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Framework web y servidor
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    # Configuración y HTTP
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    # Base de datos
    "supabase==2.31.0",
    # Google Drive
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    # Limpieza de texto
    "unidecode",
    "thefuzz",
    # Extracción de PDF y Word
    "pypdf",
    "python-docx",
    # Fragmentación de texto
    "langchain-text-splitters",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integracion: llama a los proveedores reales; necesita claves y consume cuota",
]
# Las pruebas de integración quedan excluidas por defecto. Se ejecutan con
# `pytest -m integracion`.
addopts = "-m 'not integracion'"
